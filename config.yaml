database:
  uri_env_var: MONGO_URI   # la URI real vive en .env, nunca aquí
  name: upme_solar
  collections:
    municipios: municipios
    edificios_google: edificios_google
    edificios_microsoft: edificios_microsoft
    fuentes: fuentes
    resultados: resultados
    bitacora_cargas: bitacora_cargas

crs:
  almacenamiento: EPSG:4326   # WGS84, requerido por GeoJSON / 2dsphere
  calculo_areas: EPSG:9377    # MAGNA-SIRGAS Origen Nacional

fuentes:
  mgn:
    descripcion: "Marco Geoestadístico Nacional 2025 - DANE, nivel municipio"
    url_descarga: "https://geoportal.dane.gov.co/servicios/descarga-y-metadatos/datos-geoestadisticos/?cod=111"
    destino_local: data/raw/mgn_2025/
  pdet:
    descripcion: "Listado oficial de los 170 municipios PDET"
    archivo: data/raw/MunicipiosPDET.xlsx
  google_open_buildings:
    destino_local: data/raw/google_open_buildings/
  microsoft_building_footprints:
    destino_local: data/raw/microsoft_building_footprints/
    url_indice: https://minedbuildings.z5.web.core.windows.net/global-buildings/dataset-links.csv
    region: Colombia

municipios:
  salida_geojson: data/processed/municipios_pdet.geojson
  max_bson_bytes: 16000000   # límite de documento de MongoDB

edificios:
  umbral_confianza_google_default: 0.65
  tamano_lote_insercion: 5000
  procesos: 8                # procesos en paralelo para limpiar archivos
  descargas_paralelas: 8
  salida_parquet:
    google: data/processed/edificios_google.parquet
    microsoft: data/processed/edificios_microsoft.parquet

analisis:
  # Umbrales de confianza de Google para la sensibilidad. El primero es el
  # escenario base (el mínimo del dataset) y debe coincidir con
  # edificios.umbral_confianza_google_default. Microsoft no tiene confianza.
  umbrales_google: [0.65, 0.70, 0.75]
  regla_asignacion: "centroide $geoWithin municipio (EPSG:4326, esférico)"
  salida_csv:
    municipio: data/processed/resultados_municipio.csv
    subregion: data/processed/resultados_subregion.csv
  carpeta_informe: Entrega 4

potencial:
  # Supuestos de la estimación de orden de magnitud del informe final
  # (src/analisis/potencial.py). Se aplican al área conservadora min(A_G, A_M).
  aprovechamiento: 0.40            # fracción del techo útil para módulos
  aprovechamiento_rango: [0.30, 0.50]
  densidad_kwp_m2: 0.20            # módulo de ~20 % de eficiencia (1 kW/m2 en STC)
  irradiacion_kwh_m2_dia: 4.5      # promedio nacional, Atlas de Radiación Solar (UPME-IDEAM)
  rendimiento_global: 0.80         # pérdidas de inversor, temperatura, cableado y suciedad
  salida_tex: Informe Final/tablas/potencial.tex
